[Command]
Command="
    /*
    Use keyd to paste (for evironment agnostic Wayland support)
    */

    function run() {
        const p = execute.apply(this, arguments);
        if (!p) {
            throw 'Failed to start ' + arguments[0];
        }
        if (p.exit_code !== 0) {
            throw 'Failed command ' + arguments[0] + ': ' + str(p.stderr);
        }
        return p.stdout;
    }

    function sendShortcut(...shortcut) {
        sleep(100);
        run('keyd', 'do', ...shortcut);
    }

    global.paste = function () {
        sendShortcut('paste');
    };"
Icon=
IsScript=true
Name=Paste with keyd
