# Automatically generated by espanso migration tool
# Original file: default.yml

matches:
  # Simple text replacement
  - trigger: ;+1
    replace: 👍
  - trigger: ;-1
    replace: 👎
  - trigger: ;+0
    replace: 🤏
  - trigger: ";[["
    replace: "- [ ] "

  - trigger: ;lorem
    replace: "Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."

  - trigger: ;shrug
    replace: "¯\\_(ツ)_/¯"

  - trigger: ;reg
    replace: "Regards,\nWes"

  # Symbols
  - trigger: ;cmd
    replace: ⌘

  # Work
  - trigger: ;iio
    replace: "io, io"
  - trigger: ;du
    replace: "di, uo"
  - trigger: ;io
    replace: "!IO"
  - trigger: ;pl
    replace: "print_line($|$, !IO),"
  - trigger: ;prs
    replace: "./bin/prince --shell"
  - trigger: ;jd
    replace: "js_dense_array_dump($|$, !IO),"
  - trigger: ;meeting
    replace: "{{date}}"
    vars:
      - name: date
        type: script
        params:
          args:
            - date
            - "-d"
            - friday
            - +Meeting %d %b %Y

  # Date and Time
  - trigger: ddate
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%d %b %Y"
  - trigger: dddate
    replace: "{{date}}"
    vars:
      - name: date
        type: script
        params:
          args:
            - date
  - trigger: ttime
    replace: "{{time}}"
    vars:
      - name: time
        type: date
        params:
          format: "%r"

  # Markdown
  - trigger: ;mdl
    replace: "[$|$]({{clipboard}})"
    vars:
      - name: clipboard
        type: clipboard

  ## Links and URLs

  # Rewrite Twitter links to Nitter links
  # Uses awk so we don't have to spawn a shell and deal with that.
  - trigger: ;nit
    replace: "{{link}}"
    vars:
      - name: clipboard
        type: clipboard
      - name: link
        type: shell
        params:
          cmd: "awk 'BEGIN { link = ENVIRON[\"ESPANSO_CLIPBOARD\"]; sub(/twitter\\.com/, \"nitter.net\", link); print link }'"

  # Rewrite Medium links to Scribe links
  - trigger: ;scribe
    replace: "{{link}}"
    vars:
      - name: clipboard
        type: clipboard
      - name: link
        type: shell
        params:
          cmd: "awk 'BEGIN { link = ENVIRON[\"ESPANSO_CLIPBOARD\"]; sub(/medium\\.com/, \"scribe.rip\", link); print link }'"

  - trigger: ;cas
    replace: "casuarina.org"
  - trigger: ;www
    replace: "https://www.wezm.net/"
  - trigger: ;ddd
    replace: "didoesdigital.com"
  - trigger: ;gh
    replace: "github.com/"
  - trigger: ;mm
    replace: "mastodon.decentralised.social"
  - trigger: ;src
    replace: "[Source]({{clipboard}})"
    vars:
      - name: clipboard
        type: clipboard
